name: C4-1D Campaign Balance
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Run seeded real-action scenarios
        run: node scripts/c41d-balance.mjs
      - name: Publish immutable report for inspection
        run: |
          cp -R balance-artifacts /tmp/c41d-balance-artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin c4-1d-evidence > /dev/null 2>&1; then
            git fetch origin c4-1d-evidence
            git checkout -B c4-1d-evidence origin/c4-1d-evidence
          else
            git checkout --orphan c4-1d-evidence
            git rm -rf -q . || true
          fi
          mkdir -p "reports/$GITHUB_SHA"
          cp /tmp/c41d-balance-artifacts/c41d-metrics.json "reports/$GITHUB_SHA/metrics.json"
          cp /tmp/c41d-balance-artifacts/c41d-report.md "reports/$GITHUB_SHA/report.md"
          git add "reports/$GITHUB_SHA"
          git commit -m "reports: real-action balance sample $GITHUB_SHA"
          git push origin HEAD:c4-1d-evidence
      - name: Upload empirical metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c41d-balance-evidence
          path: balance-artifacts/*
          if-no-files-found: warn
          retention-days: 30
