name: Tactics CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate types, rules and production build
        run: npm run verify
      - name: Verify independent ECS deployment scripts and CI approval policy
        run: |
          bash -n scripts/install-ecs.sh
          bash -n scripts/resume-ecs.sh
          bash -n scripts/deploy-ecs.sh
          python3 -m py_compile scripts/check-publish.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          grep -q 'OnUnitInactiveSec=3min' ops/tactics-game-deploy.timer
          grep -q '/opt/tactics-game/bin/deploy.sh' ops/tactics-game-deploy.service
      - name: Check subdirectory asset base
        run: |
          grep -q '/games/tactics/assets/' dist/index.html
          test -f dist/index.html
