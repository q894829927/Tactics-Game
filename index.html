<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="原创奇幻战棋：可缩放的战场地图与回合制战斗。"/>
  <meta name="theme-color" content="#071522"/>
  <title>未命名战棋 · 赤旗要塞</title>
  <script type="module" crossorigin src="/games/tactics/assets/index-DYeJVxD4.js"></script>
  <link rel="stylesheet" crossorigin href="/games/tactics/assets/index-B4BwpXjX.css">
</head>
<body>
  <div id="app" class="battle-shell">
    <main class="battle-layout">
      <section class="battlefield" aria-label="战棋地图">
        <div id="game" class="map-viewport" tabindex="0" aria-label="战场：滚轮缩放、按住鼠标右键拖动、左键查看地形和单位、右键友军打开指令"></div>
        <button id="settings-button" class="corner-settings" type="button" aria-label="打开设置" aria-haspopup="dialog" aria-expanded="false">⚙</button>
        <div id="viewport-hint" class="sr-only" aria-live="polite"></div>
        <div class="minimap" aria-label="战场小地图" title="点击定位，拖动地图">
          <div id="minimap-grid" class="minimap-grid" role="group" aria-label="点击小地图定位视角"></div>
        </div>
        <div id="phase-banner" class="phase-banner" hidden role="status" aria-live="polite">
          <strong id="phase-label"></strong>
          <span id="phase-caption"></span>
        </div>
        <div id="attack-forecast" class="attack-forecast" role="region" aria-label="战斗预测" hidden>
          <div class="forecast-line forecast-line-ally"></div>
          <div class="forecast-line forecast-line-enemy"></div>
          <div class="forecast-duel">
            <div class="forecast-combatant forecast-combatant-ally">
              <div class="forecast-emblem forecast-emblem-ally" id="forecast-ally-emblem" aria-hidden="true">剑</div>
              <div class="forecast-identity">
                <strong id="forecast-attacker">我方单位</strong>
                <span id="forecast-ally-role">剑士</span>
              </div>
            </div>
            <div class="forecast-center">
              <div class="forecast-stat-label">伤害</div>
              <div class="forecast-stat-values">
                <strong id="forecast-damage">—</strong>
                <span class="forecast-stat-divider">／</span>
                <strong id="forecast-counter">—</strong>
              </div>
              <div class="forecast-actions">
                <button id="forecast-cancel" type="button" aria-label="取消攻击">返回</button>
                <button id="forecast-confirm" type="button" aria-label="确认攻击">攻击</button>
              </div>
            </div>
            <div class="forecast-combatant forecast-combatant-enemy">
              <div class="forecast-identity">
                <strong id="forecast-defender">敌方单位</strong>
                <span id="forecast-enemy-role">步兵</span>
              </div>
              <div class="forecast-emblem forecast-emblem-enemy" id="forecast-enemy-emblem" aria-hidden="true">兵</div>
            </div>
          </div>
          <div class="forecast-health">
            <div class="forecast-health-side forecast-health-ally">
              <span class="forecast-hp-value" id="forecast-ally-hp">— → —</span>
              <div class="forecast-hp-track">
                <span id="forecast-ally-bar" class="forecast-hp-initial"></span>
                <span id="forecast-ally-after" class="forecast-hp-remaining"></span>
              </div>
            </div>
            <span class="forecast-hp-center">HP</span>
            <div class="forecast-health-side forecast-health-enemy">
              <div class="forecast-hp-track">
                <span id="forecast-enemy-bar" class="forecast-hp-initial"></span>
                <span id="forecast-enemy-after" class="forecast-hp-remaining"></span>
              </div>
              <span class="forecast-hp-value" id="forecast-enemy-hp">— → —</span>
            </div>
          </div>
        </div>
        <div id="result-banner" class="result-banner" hidden role="status"></div>
      </section>
      <aside class="right-sidebar" aria-label="战斗信息">
        <section class="sidebar-section unit-panel">
          <h2 class="section-title"><span class="title-icon">✥</span><span id="selection-title">选中单位</span> <span id="team-count" class="section-aside"></span></h2>
          <div class="unit-profile">
            <div id="unit-portrait" class="unit-portrait" aria-hidden="true">♜</div>
            <div class="unit-profile-detail">
              <div class="unit-name-line"><strong id="selection-name">尚未选择单位</strong><span class="crest">✥</span></div>
              <span id="selection-role" class="unit-subtitle">左键查看单位或地形</span>
              <div class="hp-caption"><span>HP</span><span id="hp-text">— / —</span></div>
              <div class="hp-track"><div id="hp-fill" class="hp-fill"></div></div>
            </div>
          </div>
          <div class="stat-row" aria-label="单位属性">
            <div><span>⚔ 攻击</span><strong id="stat-attack">—</strong></div>
            <div><span>⬡ 防御</span><strong id="stat-defense">—</strong></div>
            <div><span>◈ 射程</span><strong id="stat-range">—</strong></div>
            <div><span>✣ 移动</span><strong id="stat-move">—</strong></div>
          </div>
          <div class="terrain-summary">
            <span id="terrain-icon" class="terrain-icon">♠</span>
            <div><strong id="terrain-name">地形信息</strong><small id="terrain-hint">选择单位后显示</small></div>
            <div class="terrain-effects"><span id="terrain-defense">防御 —</span><span id="terrain-cost">消耗 —</span></div>
          </div>
        </section>
        <section class="sidebar-section equipment-panel">
          <h2 class="section-title"><span class="title-icon">⚔</span>战斗能力</h2>
          <div class="equipment-row"><span>⚔ 当前武装</span><strong id="weapon-name">—</strong></div>
          <div class="equipment-row"><span>◈ 攻击距离</span><strong id="weapon-range">—</strong></div>
          <p id="selection-hint" class="equipment-note">左键查看；右键友军打开行动菜单。</p>
        </section>
        <section class="sidebar-section combat-log">
          <h2 class="section-title"><span class="title-icon">▤</span>战斗日志 <span class="section-aside">最近记录</span></h2>
          <ol id="log-list" aria-live="polite"></ol>
        </section>
        <div class="sidebar-bottom"><small id="game-version" class="version">版本加载中</small></div>
      </aside>
    </main>
    <div id="settings-overlay" class="settings-overlay" hidden>
      <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="settings-title"><h2 id="settings-title">战场设置</h2><button id="close-settings" type="button" aria-label="关闭设置">×</button></div>
        <p>赤旗要塞 · 撤离走廊</p>
        <button id="settings-end-turn" type="button">结束我方回合</button>
        <button id="reset-view" type="button">重置地图视角</button>
        <button id="restart-button" type="button">重新开始关卡</button>
        <a href="/" class="settings-link">← 返回游戏大厅</a>
        <small>滚轮缩放 · 左键选择 · 右键拖动地图或点击友军开菜单 · Esc 返回</small>
      </div>
    </div>
  </div>
</body>
</html>
